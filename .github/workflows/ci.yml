name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx --yes @fission-ai/openspec@2.1.1 validate --specs --strict --no-interactive
        env:
          OPENSPEC_TELEMETRY: '0'
      - run: npm run build
