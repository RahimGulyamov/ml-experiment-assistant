<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run Notes — защита проекта</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f0;color:#34492b;min-height:100dvh;display:flex;flex-direction:column}header,footer{display:flex;align-items:center;justify-content:space-between;padding:22px 5vw;border-bottom:1px solid #dce4d3;font-size:12px;color:#81916f;gap:15px}footer{border-bottom:0;border-top:1px solid #dce4d3}main{padding:5vh 8vw;max-width:1300px;width:100%;margin:auto;flex:1}h1{font-size:clamp(30px,4.7vw,62px);font-weight:500;line-height:1.13;letter-spacing:-1.6px;margin:25px 0 20px}#label{font:11px monospace;text-transform:uppercase;letter-spacing:2px;color:#829d6b}#body{font-size:clamp(13px,1.5vw,19px);color:#82916e;line-height:1.7}ol{list-style:none;padding:10px 0;max-width:1000px}li{display:flex;gap:20px;border-bottom:1px solid #e0e7d8;padding:17px 0;font-size:clamp(12px,1.4vw,18px);line-height:1.6;color:#637c50}li span{font:11px monospace;color:#abbc98;padding-top:5px}aside{padding:14px 17px;background:#e9f0e1;border-left:2px solid #a1b789;font-size:12px;line-height:1.8;color:#72895e;margin:20px 0}button{border:1px solid #d1dcc6;background:transparent;border-radius:4px;color:#557341;padding:7px 12px;font-size:11px;cursor:pointer}button:focus-visible{outline:2px solid #527343;outline-offset:3px}button:disabled{opacity:.3;cursor:default}footer>div{display:flex;gap:8px}#dots button{border:0;background:#d5dfca;padding:0;width:8px;height:8px;border-radius:50%}#dots button[aria-current=step]{background:#527343}a{color:inherit;text-decoration:none}@media(max-width:600px){header>span{display:none}main{padding:30px 22px}h1{letter-spacing:-1px}li{font-size:13px;padding:14px 0}}@media print{header,footer,aside{display:none}main{padding:15px}}[hidden]{display:none!important}
</style><header><a href="./">Run Notes / личный проект</a><span>Гулямов Рахим</span><button id="notes">Заметки · N</button></header><main aria-live="polite"><div id="label"></div><h1 id="title"></h1><p id="body"></p><ol id="points"></ol><aside id="note" hidden></aside></main><footer><span id="counter"></span><div id="dots"></div><div><button id="prev" aria-label="Предыдущий слайд">←</button><button id="next" aria-label="Следующий слайд">→</button></div></footer><noscript>Включите JavaScript для переключения слайдов.</noscript><script>
const slides=[{"n":"01","label":"Задача","title":"Ассистент анализа ML-экспериментов","body":"Гулямов Рахим · личный проект","points":["Пользователь: ML-инженер, сравнивающий серию запусков.","Вход: итоговые метрики, параметры и история обучения.","Выход: обоснованное сравнение и гипотеза следующего эксперимента."],"note":"Покажу работающий сценарий, затем границы и проверки. Учебные данные синтетические."},{"n":"02","label":"Проблема","title":"Максимальная метрика — только часть ответа","body":"Нужно учитывать качество, стоимость обучения и надёжность сравнения.","points":["Более точный запуск может обучаться заметно дольше.","Итоговая метрика скрывает ухудшение validation loss.","Изменение сразу нескольких параметров не позволяет установить причину улучшения."],"note":"Задача ассистента — собрать факты и объяснить компромиссы. Он не проводит эксперименты за пользователя."},{"n":"03","label":"Архитектура","title":"Проверяемые факты отдельно от объяснения","body":"Пользователь → Web UI → LLM → MCP client → MCP server → аналитика → ответ","points":["TypeScript + React/Vinext; сервер работает в Cloudflare Workers.","Официальный MCP SDK: initialize, tools/list, tools/call.","Внутренний HTTP transport привязан к данным одного запроса; /api/mcp доступен внешним клиентам с учебным набором."],"note":"Диспетчеризация внутреннего HTTP выполняется локальным fetch-адаптером. Это реальный JSON-RPC через SDK, но без внешнего сетевого перехода."},{"n":"04","label":"AI-логика","title":"Модель выбирает инструменты по вопросу","body":"OpenAI-compatible tool calling; ключ подключается пользователем.","points":["list_runs: доступные запуски и параметры.","compare_runs: ранжирование, baseline, разницы и исключения.","inspect_run и diagnose_run: история и признаки переобучения.","До 6 раундов и 12 вызовов; численные факты вычисляет код."],"note":"Расчётный режим без ключа — отдельный режим и не заменяет LLM-демонстрацию."},{"n":"05","label":"Демонстрация","title":"Три вопроса к одной серии запусков","body":"Откройте приложение в соседней вкладке. На показ — около трёх минут.","points":["Выбрать run-001, run-003, run-004, run-005; accuracy ↑.","Спросить, какой запуск выбрать; раскрыть compare_runs и сверить 0.927 у run-005.","Проверить run-004: validation loss растёт после минимума.","Попросить следующий эксперимент: зафиксировать остальные параметры и повторить seed. Скачать отчёт."],"note":"Если ключ не подключён, покажите только расчётный обзор и честно обозначьте, что реальный LLM-сценарий ещё не проверен."},{"n":"06","label":"Разработка","title":"Спецификация → код → проверка","body":"AI-агент использовался для реализации. Результат принимается по проверяемым критериям.","points":["В OpenSpec зафиксированы сценарии импорта, сравнения, MCP и ошибки LLM.","Численные функции проверяются ожидаемыми значениями, MCP — настоящим SDK-клиентом.","Цикл агента проверяется тестовым провайдером; это отдельно от запроса к реальной модели.","После реализации выполнен отдельный разбор дефектов. Подробности — docs/verification.md."],"note":"Не утверждайте, что любой зелёный тест доказывает качество объяснения. Для этого нужны реальные запросы и ручная оценка."},{"n":"07","label":"Границы","title":"Что система не обещает","body":"MVP ограничен анализом уже выполненных запусков.","points":["Один seed не доказывает статистическую значимость.","Диагностика переобучения — эвристика по loss.","Нет облачного хранения, обучения моделей и интеграции MLflow/W&B.","Для полной сдачи нужны доступный сервис, публичный репозиторий, реальная модель и обязательный воркшоп."],"note":"Следующее развитие: адаптер MLflow, повторные seed, доверительные интервалы и оценка качества ответов на наборе вопросов."},{"n":"08","label":"Результат","title":"Рабочая область для разбора экспериментов","body":"Данные → инструменты → объяснение → проверка человеком","points":["Импорт JSON/CSV и изоляция данных запроса.","Сравнение метрик и история train/validation loss.","LLM-ассистент с видимыми MCP-вызовами.","Воспроизводимый запуск, тесты, спецификация и документация."],"note":"Готов ответить на вопросы о выборе архитектуры, MCP, ограничениях анализа и способах проверки."}];let index=0;let notes=false;const $=id=>document.getElementById(id);
function render(){const s=slides[index];$('label').textContent=s.n+' / '+s.label;$('title').textContent=s.title;$('body').textContent=s.body;$('points').replaceChildren(...s.points.map((p,i)=>{const li=document.createElement('li');const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');li.append(n,document.createTextNode(p));return li}));$('note').textContent=s.note;$('note').hidden=!notes;$('counter').textContent=(index+1)+' / '+slides.length;$('prev').disabled=index===0;$('next').disabled=index===slides.length-1;$('dots').replaceChildren(...slides.map((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Слайд '+(i+1));if(i===index)b.setAttribute('aria-current','step');b.onclick=()=>{index=i;render()};return b}));}
$('prev').onclick=()=>{index=Math.max(0,index-1);render()};$('next').onclick=()=>{index=Math.min(slides.length-1,index+1);render()};$('notes').onclick=()=>{notes=!notes;render()};document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft',' '].includes(e.key)){e.preventDefault();index=Math.max(0,Math.min(slides.length-1,index+(e.key==='ArrowLeft'?-1:1)));render()}if(e.key.toLowerCase()==='n'){notes=!notes;render()}});render();
</script></html>
